<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS UI Components</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <section class="page">

        <h1>CSS UI Components</h1>

        

        <div class="tooltip-box">

            <button>Hover Me</button>

            <span class="tooltip">
                This is a CSS tooltip!
            </span>

        </div>


       

        <div class="modal-demo">

            

            <input type="checkbox" id="modal">

            

            <label for="modal" class="open-btn">
                Open Modal
            </label>


           
            <div class="modal">

                <div class="modal-content">

                  

                    <label for="modal" class="close-btn">
                        ×
                    </label>

                    <h2>Welcome</h2>

                    <p>
                        This modal is created using only HTML and CSS.
                    </p>

                    <button>
                        Continue
                    </button>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
